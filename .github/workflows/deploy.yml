name: Publicar site no GitHub Pages

on:
  push:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Baixar o código
        uses: actions/checkout@v4

name: Trocar __VERSION__ pelo hash do commit (força atualização de cache)
run: |
  VERSION="${GITHUB_SHA::8}"
  find . -name "*.html" -not -path "./.git/*" -exec sed -i "s/__VERSION__/$VERSION/g" {} \;

name: Preparar arquivos para publicação
uses: actions/upload-pages-artifact@v3
with:
  path: .

deploy:
needs: build
runs-on: ubuntu-latest
environment:
name: github-pages
url: ${{ steps.deployment.outputs.page_url }}
steps:

name: Publicar no GitHub Pages
id: deployment
uses: actions/deploy-pages@v4
